services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: submgr
      POSTGRES_PASSWORD: submgr
      POSTGRES_DB: submgr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U submgr"]
      interval: 5s
      retries: 10

  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
